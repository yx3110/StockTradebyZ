# 股票相似度回测系统默认配置文件

# 数据配置
data:
  database_path: '../data_adapter/stock_data.db'
  start_date: '2020-01-01'
  end_date: '2025-08-08'
  data_types:
    - daily_quotes
    - daily_basic
    - technical_indicators
  
  # 数据预处理
  preprocessing:
    normalize_prices: true  # 转换为对数收益率
    normalize_volume: true  # 转换为换手率
    z_score_normalization: true  # Z-score标准化
    handle_missing: 'forward_fill'  # 缺失值处理: forward_fill, backward_fill, interpolate
    remove_outliers: true
    outlier_threshold: 3  # 3倍标准差

# 相似度搜索配置
similarity:
  # 窗口长度配置
  window_lengths: [20, 30, 60]  # 多窗口长度
  default_window: 30
  
  # 算法配置
  algorithms:
    matrix_profile:
      enabled: true
      weight: 0.4
      exclusion_zone: 30  # 排除带
      
    dtw:
      enabled: true
      weight: 0.3
      sakoe_chiba_band: 5  # DTW带宽约束
      
    mass:
      enabled: true
      weight: 0.3
      
    kshape:
      enabled: false
      weight: 0.0
      n_clusters: 5
      
  # 多维度配置
  multivariate:
    enabled: true
    dimensions:
      - 'log_return'  # 对数收益率
      - 'log_volume_change'  # 对数成交量变化
      - 'turnover_rate'  # 换手率
    price_weight: 0.7  # 价格权重
    volume_weight: 0.3  # 成交量权重
    
  # 搜索参数
  search:
    top_k: 10  # 返回最相似的K个结果
    min_similarity: 0.1  # 最小相似度阈值 (降低门槛)
    parallel_workers: 2  # 并行计算进程数 (减少日志噪音)

# 过滤条件
filters:
  # 成交额过滤
  min_daily_volume: 10000000  # 最小日成交额1千万 (降低门槛)
  
  # 市值过滤
  min_market_cap: 1000000  # 最小市值100万 (大幅降低门槛)
  max_market_cap: null  # 最大市值不限
  
  # 行业过滤
  exclude_industries: []  # 排除的行业
  include_industries: []  # 仅包含的行业（空表示全部）
  
  # 时间过滤
  exclude_dates: []  # 排除的日期（如节假日前后）
  min_history_days: 250  # 最小历史数据天数
  
  # 交易状态过滤
  exclude_suspended: true  # 排除停牌
  exclude_limit_up_down: true  # 排除涨跌停
  
  # 自匹配过滤
  exclude_self: true  # 排除自己
  exclude_same_period: true  # 排除同时期

# 回测配置
backtest:
  # 评估时间窗口
  evaluation_horizons: [5, 10, 20, 60]  # 天
  
  # 交易成本
  transaction_cost: 0.001  # 0.1% (10 bps)
  slippage: 0.0005  # 0.05% (5 bps)
  
  # 风险管理
  max_position_size: 0.1  # 单只股票最大仓位10%
  stop_loss: 0.08  # 止损8%
  take_profit: null  # 不设止盈
  
  # 统计检验
  bootstrap_iterations: 1000  # Bootstrap迭代次数
  confidence_level: 0.95  # 置信水平
  
  # 基准配置
  benchmark: '000300.SH'  # 沪深300作为基准
  risk_free_rate: 0.02  # 无风险利率2%
  
  # 验证方法
  validation:
    method: 'rolling'  # rolling, expanding, walk_forward
    window_size: 252  # 滚动窗口大小（交易日）
    step_size: 20  # 步进大小

# 报告配置
report:
  # 输出路径
  output_dir: 'reports/'
  
  # 报告格式
  formats:
    - html
    - pdf
    - json
    
  # 图表配置
  charts:
    similarity_heatmap: true
    k_line_comparison: true
    return_distribution: true
    performance_timeline: true
    parameter_sensitivity: true
    
  # 图表样式
  plot_style: 'seaborn'
  figure_size: [12, 8]
  dpi: 100
  
  # 统计报告
  statistics:
    show_descriptive_stats: true
    show_hypothesis_tests: true
    show_confidence_intervals: true
    
# 性能优化
performance:
  # 缓存配置
  use_cache: true
  cache_dir: 'cache/'
  cache_expire_hours: 24
  
  # 计算优化
  use_numba: true  # 使用Numba加速
  use_gpu: false  # 使用GPU（需要CuPy）
  
  # 内存管理
  chunk_size: 1000  # 批处理大小
  max_memory_gb: 8  # 最大内存使用

# 日志配置
logging:
  level: 'INFO'  # DEBUG, INFO, WARNING, ERROR
  log_dir: 'logs/'
  log_file: 'similarity_backtest.log'
  console_output: true
  file_output: true
  
# 系统配置
system:
  random_seed: 42  # 随机种子
  n_jobs: -1  # 并行任务数（-1表示使用所有CPU）
  verbose: 1  # 输出详细程度（0-2）
  
# 高级配置
advanced:
  # 特征工程
  feature_engineering:
    technical_indicators:
      - RSI
      - MACD
      - KDJ
      - BBI
    custom_features:
      - price_volume_correlation
      - volume_ratio
      - obv_change_rate
      
  # 深度学习配置（可选）
  deep_learning:
    enabled: false
    model: 'TS2Vec'  # TS2Vec, Transformer
    embedding_dim: 128
    
  # 向量检索（大规模优化）
  vector_search:
    enabled: false
    index_type: 'FAISS'  # FAISS, HNSW
    dimension_reduction: 'PCA'  # PCA, UMAP, None
    reduced_dim: 16