[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers

markers =
    unit: Unit tests for isolated functions and classes
    integration: Integration tests that combine multiple components
    slow: Tests that take a long time to run (>1 second)

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
