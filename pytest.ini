[pytest]
# 注意: stock_selctor/test 不能并入 testpaths — tests/conftest.py 会把根目录 Selector.py
# 预载进 sys.modules['Selector'], 与 stock_selctor/Selector.py (双副本分叉) 冲突,
# 合跑时 test_selector_classes.py 收集即 ImportError。需单独跑:
#   python3 -m pytest stock_selctor/test/ -q
# 待双份 Selector.py 合并后再统一 testpaths。
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers

markers =
    unit: Unit tests for isolated functions and classes
    integration: Integration tests that combine multiple components
    slow: Tests that take a long time to run (>1 second)

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
