{% extends "base.html" %}

{% block title %}板块排行 - StockTradebyZ{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/market.css') }}">
{% endblock %}

{% block content %}
<div class="d-flex align-items-center flex-wrap gap-3 mb-3">
    <h4 class="mb-0"><i class="bi bi-grid-3x3-gap"></i> 板块排行</h4>
    <div class="btn-group taxonomy-tabs" id="taxonomyTabs" role="group">
        <button type="button" class="btn btn-outline-primary active" data-taxonomy="sw_l1">一级行业</button>
        <button type="button" class="btn btn-outline-primary" data-taxonomy="sw_l2">二级行业</button>
        <button type="button" class="btn btn-outline-primary" data-taxonomy="concept">概念板块</button>
    </div>
    <select class="form-select form-select-sm w-auto" id="daysSelect">
        <option value="20">近20日</option>
        <option value="40" selected>近40日</option>
        <option value="60">近60日</option>
        <option value="120">近120日</option>
    </select>
    <span class="text-muted small" id="statusLine"></span>
</div>

<div class="card mb-3">
    <div class="card-body">
        <div class="market-section-title">
            📅 轮动日历<span class="hint">每日涨幅前25板块 · 同板块颜色恒定 · 悬浮查看涨幅</span>
        </div>
        <div class="calendar-scroll" id="calendarWrap">
            <div class="text-center text-muted py-5" id="calendarLoading">
                <div class="spinner-border spinner-border-sm"></div> 加载中...
            </div>
            <div id="calendar"></div>
        </div>
    </div>
</div>

<div class="card mb-3">
    <div class="card-body">
        <div class="market-section-title">
            📈 创新高日历<span class="hint">每日创20日新高个股数排名 · 括号内为个股数</span>
        </div>
        <div class="calendar-scroll" id="newhighWrap">
            <div id="newhigh"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/market_common.js') }}"></script>
<script>
let TAXONOMY = 'sw_l1';

function load() {
    const days = document.getElementById('daysSelect').value;
    document.getElementById('calendarLoading').style.display = '';
    api.get('/api/market/rotation', { taxonomy: TAXONOMY, days: days }).done(d => {
        document.getElementById('calendarLoading').style.display = 'none';
        if (!d.success || !d.dates.length) {
            document.getElementById('calendar').innerHTML = MARKET_NO_DATA_HTML;
            document.getElementById('newhigh').innerHTML = '';
            return;
        }
        setStatusLine(d.dates);

        document.getElementById('calendar').innerHTML = buildCalendarTable(
            TAXONOMY, d.dates, d.calendar,
            it => ({
                name: it.name,
                label: it.name,
                sub: (it.pct > 0 ? '+' : '') + it.pct.toFixed(1) + '%',
                title: `${it.name} ${it.pct > 0 ? '+' : ''}${it.pct}%`
            }));
        document.getElementById('newhigh').innerHTML = buildCalendarTable(
            TAXONOMY, d.dates, d.newhighs,
            it => ({
                name: it.name,
                label: it.name,
                sub: `(${it.cnt})`,
                title: `${it.name}: ${it.cnt} 只创20日新高`
            }));
        scrollToRight(document.getElementById('calendarWrap'));
        scrollToRight(document.getElementById('newhighWrap'));
    });
}

bindTaxonomyTabs('taxonomyTabs', t => { TAXONOMY = t; load(); });
initMarketPage(load);
</script>
{% endblock %}
